site_name: Rumble Chat Actor Docs

theme:
  name: "material"
#  logo: assets/cocorum_icon.png

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            # Many classes document their **kwargs as Args, which griffe
            # would otherwise warn about (and --strict would fail on).
            docstring_options:
              warn_unknown_params: false

nav:
  - Home: index.md
  - tutorials.md
  - How-To Guides: how-to-guides.md
  - Reference:
    - modules_ref/main.md
    - modules_ref/actions.md
    - modules_ref/commands.md
    - modules_ref/misc.md
    - modules_ref/utils.md
    - modules_ref/static.md
    - action_properties.md
  - explanation.md
